      }
      @keyframes fadeIn1 { from { opacity: 0; } to { opacity: 1; } }
      @keyframes fadeIn2 { from { opacity: 0; } to { opacity: 1; } }
      @keyframes fadeIn3 { from { opacity: 0; } to { opacity: 1; } }
      @keyframes fadeIn4 { from { opacity: 0; } to { opacity: 1; } }
      @keyframes fadeIn5 { from { opacity: 0; } to { opacity: 1; } }
      @keyframes fadeIn6 { from { opacity: 0; } to { opacity: 1; } }
      @keyframes fadeIn7 { from { opacity: 0; } to { opacity: 1; } }
      @keyframes fadeIn8 { from { opacity: 0; } to { opacity: 1; } }
      @keyframes fadeIn9 { from { opacity: 0; } to { opacity: 1; } }
      @keyframes fadeIn10 { from { opacity: 0; } to { opacity: 1; } }
      @keyframes fadeIn11 { from { opacity: 0; } to { opacity: 1; } }
      @keyframes fadeIn12 { from { opacity: 0; } to { opacity: 1; } }
      @keyframes slideIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

      .line1  { animation: fadeIn1  0.4s ease forwards; animation-delay: 0.2s; opacity: 0; }
      .line2  { animation: fadeIn2  0.4s ease forwards; animation-delay: 0.6s; opacity: 0; }
      .line3  { animation: fadeIn3  0.4s ease forwards; animation-delay: 1.0s; opacity: 0; }
      .line4  { animation: fadeIn4  0.4s ease forwards; animation-delay: 1.4s; opacity: 0; }
      .line5  { animation: fadeIn5  0.4s ease forwards; animation-delay: 1.8s; opacity: 0; }
      .line6  { animation: fadeIn6  0.4s ease forwards; animation-delay: 2.2s; opacity: 0; }
      .line7  { animation: fadeIn7  0.4s ease forwards; animation-delay: 2.6s; opacity: 0; }
      .line8  { animation: fadeIn8  0.4s ease forwards; animation-delay: 3.0s; opacity: 0; }
      .line9  { animation: fadeIn9  0.4s ease forwards; animation-delay: 3.4s; opacity: 0; }
      .line10 { animation: fadeIn10 0.4s ease forwards; animation-delay: 3.8s; opacity: 0; }
      .line11 { animation: fadeIn11 0.4s ease forwards; animation-delay: 4.2s; opacity: 0; }
      .line12 { animation: fadeIn12 0.4s ease forwards; animation-delay: 4.6s; opacity: 0; }
      .cursor { animation: blink 1s step-end infinite; animation-delay: 5.0s; opacity: 0; }

      .mono { font-family: 'Courier New', Courier, monospace; }
      .prompt { fill: #58a6ff; }
      .cmd    { fill: #f0f6fc; }
      .comment { fill: #484f58; }
      .green  { fill: #3fb950; }
      .amber  { fill: #d29922; }
      .blue   { fill: #58a6ff; }
      .purple { fill: #bc8cff; }
      .muted  { fill: #8b949e; }
      .dim    { fill: #484f58; }
      .white  { fill: #f0f6fc; }
      .tag-bg { fill: #21262d; }
      .tag-border { stroke: #30363d; fill: none; }
    </style>
